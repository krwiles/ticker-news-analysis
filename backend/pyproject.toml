[project]
name = "ticker-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krwiles", email = "kurtis.r.wiles@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    # SQLAlchemy's async engine needs this under the hood. Declared directly
    # rather than relying on SQLAlchemy's own transitive marker for it --
    # that marker lists Linux's "aarch64" for ARM but not macOS's own
    # "arm64" string, so it silently doesn't install on Apple Silicon Macs
    # otherwise (found running the test suite locally for the first time).
    "greenlet>=3.1.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "redis>=5.3.1",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
